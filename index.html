<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>size2size.com satılıktır</title>
<meta name="description" content="size2size.com alan adı satılıktır. This domain is for sale.">
<meta name="robots" content="noindex">
<style>
:root { --bg: #1A1A1A; --ink: #F2F2F0; --muted: #A7A7A2; --line: rgba(242, 242, 240, 0.22); --accent: #FF6B1A; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; display: grid; place-items: center; padding: 32px 16px; -webkit-font-smoothing: antialiased; }
main { width: min(720px, 100%); }
.domain { font-weight: 800; font-size: clamp(2.6rem, 11vw, 5.6rem); letter-spacing: -0.03em; line-height: 1; margin: 0 0 18px; overflow-wrap: anywhere; }
.domain span { color: var(--accent); }
.tr { font-size: clamp(1.3rem, 4vw, 2rem); margin: 0 0 6px; }
.en { font-size: clamp(1rem, 3vw, 1.3rem); color: var(--muted); margin: 0 0 36px; }
.contact { border-top: 1px solid var(--line); padding-top: 24px; }
.contact p { margin: 0 0 14px; color: var(--muted); }
.btn { display: inline-block; background: var(--ink); color: var(--bg); font-weight: 700; text-decoration: none; border-radius: 999px; padding: 12px 22px; overflow-wrap: anywhere; }
.btn:hover { background: var(--accent); color: #111; }
</style>
</head>
<body>
<main>
  <h1 class="domain">size<span>2</span>size.com</h1>
  <p class="tr">Bu alan adı satılıktır.</p>
  <p class="en">This domain is for sale.</p>
  <div class="contact">
    <p>Teklif ve iletişim için / For offers and enquiries:</p>
    <a class="btn" id="mail" href="#">efeibrahimefe [at] googlemail.com</a>
  </div>
</main>
<script>
/* the address is assembled in the browser so simple scrapers do not pick it up */
(function () {
  var u = 'efeibrahimefe', d = 'googlemail.com', a = document.getElementById('mail');
  a.href = 'mailto:' + u + '@' + d + '?subject=' + encodeURIComponent('size2size.com');
  a.textContent = u + '@' + d;
})();
</script>
</body>
</html>
